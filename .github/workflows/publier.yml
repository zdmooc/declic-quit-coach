name: Publier sur les téléphones

# Publie une mise à jour EAS Update (canal preview) sans passer par le PC :
# automatiquement après chaque push sur main qui touche l'app (si les tests passent),
# ou à la main depuis GitHub (Actions → « Publier sur les téléphones » → Run workflow).
#
# Prérequis : secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
#
# Version d'exécution : celle de l'APK installé (calculée sous Windows, empreinte « fingerprint »).
# Linux calcule une autre empreinte pour le même code : on fixe donc la valeur de l'APK.
# À METTRE À JOUR après chaque nouveau build d'APK (valeur affichée par `eas update` sous Windows).
env:
  RUNTIME_APK: 588937ab223897229eb146e351dfae384bbc529c  # ⚠️ à remplacer après le build Health Connect
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publier.yml']
  workflow_dispatch:
    inputs:
      message:
        description: Message de la mise à jour
        required: false

permissions:
  contents: read

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Vérifier avant de publier
        run: npm run lint && npm run typecheck && npm test
      # L'empreinte calculée ici diffère de celle de Windows même sans changement natif : on ne
      # peut pas la comparer. Règle : toute nouvelle dépendance native (expo install …) ou tout
      # changement d'app.json impose un nouvel APK avant de publier, puis la mise à jour de RUNTIME_APK.
      - name: Fixer la version d'exécution de l'APK
        run: node -e "const f='app.json',j=require('./'+f);j.expo.runtimeVersion=process.env.RUNTIME_APK;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Jeton Expo absent
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::Secret EXPO_TOKEN absent, rien n'est publié (Settings, Secrets and variables, Actions)."
      - name: Publier
        if: env.EXPO_TOKEN != ''
        env:
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: npx eas-cli@latest update --channel preview --environment preview --platform android --non-interactive --message "$(echo "$MESSAGE" | head -1)"
