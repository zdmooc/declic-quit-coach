name: Publier sur les téléphones

# Publie une mise à jour EAS Update (canal preview) sans passer par le PC :
# automatiquement après chaque push sur main qui touche l'app (si les tests passent),
# ou à la main depuis GitHub (Actions → « Publier sur les téléphones » → Run workflow).
#
# Prérequis : secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
#
# Version d'exécution : celle du DERNIER APK construit sur EAS (lue automatiquement avec
# `eas build:list`). Linux calcule une autre empreinte que Windows pour le même code : on vise donc
# toujours la valeur de l'APK réellement installé. RUNTIME_APK ne sert qu'en secours.
env:
  RUNTIME_APK: 588937ab223897229eb146e351dfae384bbc529c
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publier.yml']
  workflow_dispatch:
    inputs:
      message:
        description: Message de la mise à jour
        required: false

permissions:
  contents: read

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Vérifier avant de publier
        run: npm run lint && npm run typecheck && npm test
      # L'empreinte calculée ici diffère de celle de Windows même sans changement natif : on ne
      # peut pas la comparer. Règle : toute nouvelle dépendance native (expo install …) ou tout
      # changement d'app.json impose un nouvel APK avant de publier, puis la mise à jour de RUNTIME_APK.
      - name: Fixer la version d'exécution du dernier APK
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            npx eas-cli@latest build:list --platform android --channel preview --status finished --limit 1 --json --non-interactive > builds.json 2> builds.err || echo '[]' > builds.json
            echo "::notice title=build:list::$(head -c 300 builds.err | tr '\n' ' ')"
            DERNIER=$(node -e "const b=(t=>{try{return JSON.parse(t.slice(t.indexOf('[')))}catch{return []}})(require('fs').readFileSync('builds.json','utf8'));console.log((b[0]&&b[0].runtimeVersion)||'')")
          fi
          export RUNTIME="${DERNIER:-$RUNTIME_APK}"
          echo "::notice title=Version visée::$RUNTIME (dernier APK : ${DERNIER:-introuvable, secours utilisé})"
          node -e "const b=(t=>{try{return JSON.parse(t.slice(t.indexOf('[')))}catch{return []}})(require('fs').readFileSync('builds.json','utf8'));const x=b[0]||{};console.log('::notice title=Dernier build::'+JSON.stringify(x).replace(/[\\r\\n]/g,' ').slice(0,3000))" || true
          node -e "const f='app.json',j=require('./'+f);j.expo.runtimeVersion=process.env.RUNTIME;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Jeton Expo absent
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::warning::Secret EXPO_TOKEN absent, rien n'est publié (Settings, Secrets and variables, Actions)."
      - name: Publier
        if: env.EXPO_TOKEN != ''
        env:
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
        run: npx eas-cli@latest update --channel preview --environment preview --platform android --non-interactive --message "$(echo "$MESSAGE" | head -1)"
